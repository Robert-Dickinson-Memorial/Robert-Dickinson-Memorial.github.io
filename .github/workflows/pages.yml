name: Deploy memorial website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static publication
        env:
          MEMORIAL_API_BASE: ${{ vars.MEMORIAL_API_BASE }}
        run: |
          mkdir -p _site/assets/landmarks _site/memory-book _site/tree _site/life _site/legacy _site/events _site/gallery _site/memories
          cp static/index.html _site/index.html
          cp static/sections.html _site/life/index.html
          cp static/sections.html _site/legacy/index.html
          cp static/sections.html _site/events/index.html
          cp static/sections.html _site/gallery/index.html
          cp static/sections.html _site/memories/index.html
          cp static/site.js _site/site.js
          # RD_EVENT_PROGRAM: publish the two original PDFs without changing them.
          mkdir -p _site/events/2026-10-09
          cp public/events/2026-10-09/*.pdf _site/events/2026-10-09/
          cp static/config.js _site/config.js
          cp static/robots.txt _site/robots.txt
          cp static/sitemap.xml _site/sitemap.xml
          cp static/memory-book.html _site/memory-book/index.html
          cp public/memory-book.js public/memory-book.css _site/
          cp public/memory-reader-media.js public/memory-reader-media.css _site/
          node --check public/memory-reader-media.js
          cp -r public/memory-book-fonts _site/memory-book-fonts
          cp static/tree/index.html _site/tree/index.html
          python3 scripts/add-seo.py
          tail -n +4 app/globals.css > _site/assets/styles.css
          # Give every deployment fresh asset URLs, including the shared photo reader.
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["GITHUB_SHA"]
          for page in Path("_site").rglob("*.html"):
              html = page.read_text()
              html = html.replace("assets/styles.css", f"assets/styles.css?v={version}").replace("site.js", f"site.js?v={version}").replace("memory-book.css", f"memory-book.css?v={version}")
              reader = f'<link rel="stylesheet" data-memory-reader-media href="/memory-reader-media.css?v={version}"><script type="module" data-memory-reader-media src="/memory-reader-media.js?v={version}"></script>'
              # Loaded on every entry page so soft navigation to Memories also works.
              page.write_text(html.replace("</head>", reader + "\n</head>"))
          PY
          cp public/robert-dickinson.jpg _site/assets/robert-dickinson.jpg
          cp public/dickinson-1967-mit-phd.jpg _site/assets/dickinson-1967-mit-phd.jpg
          cp public/memorial-horizon.png _site/assets/memorial-horizon.png
          cp public/life-reference-background-v1.webp _site/life-reference-background-v1.webp
          cp public/legacy-science-reference.webp _site/assets/legacy-science-reference.webp
          cp public/legacy-threads-large-labels.webp _site/assets/legacy-threads-large-labels.webp
          cp public/landmarks/*.svg _site/assets/landmarks/
          cp public/tree-landscapes.webp _site/tree-landscapes.webp
          cp public/home-earth.jpg _site/home-earth.jpg
          cp public/home-earth.jpg public/life-reference-background-v1.webp public/tree-landscapes.webp _site/assets/
          cp public/favicon.svg _site/favicon.svg
          touch _site/.nojekyll
          node -e 'require("node:fs").writeFileSync("_site/config.js", `window.MEMORIAL_API_BASE = ${JSON.stringify(process.env.MEMORIAL_API_BASE || "")};\n`)'

      - name: Mirror approved public stories and photographs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          npm install --prefix "$RUNNER_TEMP/memorial-mirror-tools" wrangler@4.92.0
          export WRANGLER_BIN="$RUNNER_TEMP/memorial-mirror-tools/node_modules/.bin/wrangler"
          python3 scripts/build-public-mirror.py

      - name: Validate public memory order and story cleanup
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          data = json.loads(Path("_site/mirror/api/memories.json").read_text(encoding="utf-8"))["memories"]
          names = [str(item.get("name") or "") for item in data]
          norm = lambda value: re.sub(r"[^a-z]+", " ", value.lower()).strip()

          def find_person(tokens):
              for i, name in enumerate(names):
                  words = set(norm(name).split())
                  if all(token in words for token in tokens):
                      return i
              raise SystemExit(f"Missing public memory: {' '.join(tokens)}")

          zong = find_person(("zong", "liang", "yang"))
          order = [(str(item.get("createdAt") or ""), int(item["id"])) for item in data]
          if order != sorted(order):
              raise SystemExit("Memories are not ordered by original upload time, earliest first")

          zong_story = str(data[zong].get("story") or "")
          caption = re.compile(r"(?im)^\s*(?:fig(?:ure)?\.?|photo|plate)\s*(?:\d+)?\s*[:.\-)–—]?\s+")
          if caption.search(zong_story):
              raise SystemExit("Zong-Liang Yang public story still contains a figure/photo caption")

          print("Validated public memory order:", " > ".join(names[:8]))
          print("Validated Zong-Liang Yang story caption cleanup.")
          PY

      - name: Generate the current printable memory book
        run: |
          python3 -m pip install Pillow fonttools
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Serif/OTF/SimplifiedChinese/NotoSerifCJKsc-Regular.otf' -o "$RUNNER_TEMP/NotoSerifCJKsc-Regular.otf"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Serif/LICENSE' -o "$RUNNER_TEMP/Noto-CJK-LICENSE.txt"
          export MEMORIAL_BOOK_CJK_FONT="$RUNNER_TEMP/NotoSerifCJKsc-Regular.otf"
          export MEMORIAL_BOOK_CJK_LICENSE="$RUNNER_TEMP/Noto-CJK-LICENSE.txt"
          python3 scripts/prepare-book-images.py _site
          npm install --prefix "$RUNNER_TEMP/memorial-book-tools" playwright@1.58.2
          "$RUNNER_TEMP/memorial-book-tools/node_modules/.bin/playwright" install --with-deps chromium
          export MEMORIAL_BOOK_PLAYWRIGHT="$RUNNER_TEMP/memorial-book-tools/node_modules/playwright"
          node scripts/generate-memory-book.mjs _site

      - name: Test full-story photographs and zoom before publication
        run: |
          export MEMORIAL_BOOK_PLAYWRIGHT="$RUNNER_TEMP/memorial-book-tools/node_modules/playwright"
          node scripts/test-memory-reader-media.mjs _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published memories edition
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request

          base = os.environ["PAGE_URL"].rstrip("/")
          expected = os.environ["GITHUB_SHA"]

          def fetch(path):
              req = urllib.request.Request(base + path, headers={"Cache-Control":"no-cache", "User-Agent":"memorial-deploy-check"})
              with urllib.request.urlopen(req, timeout=30) as res:
                  return res.read()

          # Pages/CDN can take a few seconds after deploy to expose the new artifact.
          last = None
          for _ in range(12):
              try:
                  js = fetch(f"/site.js?v={expected}").decode("utf-8", "replace")
                  payload = json.loads(fetch("/mirror/api/memories.json?rev=" + expected))
                  names = [str(item.get("name") or "") for item in payload["memories"]]
                  normalize = lambda value: re.sub(r"[^a-z]+", " ", value.lower()).strip()
                  zong = next(i for i,n in enumerate(names) if {"zong","liang","yang"} <= set(normalize(n).split()))
                  if 'path === "/api/memories"' not in js:
                      raise AssertionError("published site.js is not the live-first memories renderer")
                  order = [(str(item.get("createdAt") or ""), int(item["id"])) for item in payload["memories"]]
                  if order != sorted(order):
                      raise AssertionError("published memories are not earliest-upload-first")
                  story = str(payload["memories"][zong].get("story") or "")
                  if re.search(r"(?im)^\s*(?:fig(?:ure)?\.?|photo|plate)\s*(?:\d+)?\s*[:.\-)–—]?\s+", story):
                      raise AssertionError("published Zong story still contains a figure/photo caption")
                  print("Published site verified:", " > ".join(names[:8]))
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(5)
          else:
              raise SystemExit(f"Published-site verification failed: {last}")
          PY

      - name: Verify photo reader on the live public website
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          export MEMORIAL_BOOK_PLAYWRIGHT="$RUNNER_TEMP/memorial-book-tools/node_modules/playwright"
          node scripts/test-memory-reader-media.mjs "$PAGE_URL"
