name: Deploy memorial website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Extract shared-memory PDF text and previews']
    types: [completed]
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static publication
        env:
          MEMORIAL_API_BASE: ${{ vars.MEMORIAL_API_BASE }}
        run: |
          mkdir -p _site/assets/landmarks _site/memory-book _site/tree _site/life _site/legacy _site/events _site/gallery _site/memories
          cp static/index.html _site/index.html
          cp static/sections.html _site/life/index.html
          cp static/sections.html _site/legacy/index.html
          cp static/sections.html _site/events/index.html
          cp static/sections.html _site/gallery/index.html
          cp static/sections.html _site/memories/index.html
          cp static/site.js _site/site.js
          cp static/config.js _site/config.js
          cp static/memory-book.html _site/memory-book/index.html
          cp static/tree/index.html _site/tree/index.html
          tail -n +4 app/globals.css > _site/assets/styles.css
          # Give every deployment a fresh stylesheet URL to avoid stale browser caches.
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["GITHUB_SHA"]
          for page in Path("_site").rglob("*.html"):
              html = page.read_text()
              page.write_text(html.replace("assets/styles.css", f"assets/styles.css?v={version}").replace("site.js", f"site.js?v={version}"))
          PY
          cp public/robert-dickinson.jpg _site/assets/robert-dickinson.jpg
          cp public/dickinson-1967-mit-phd.jpg _site/assets/dickinson-1967-mit-phd.jpg
          cp public/memorial-horizon.png _site/assets/memorial-horizon.png
          cp public/life-reference-background-v1.webp _site/life-reference-background-v1.webp
          cp public/legacy-science-reference.webp _site/assets/legacy-science-reference.webp
          cp public/legacy-threads-large-labels.webp _site/assets/legacy-threads-large-labels.webp
          cp public/landmarks/*.svg _site/assets/landmarks/
          cp public/favicon.svg _site/favicon.svg
          touch _site/.nojekyll
          node -e 'require("node:fs").writeFileSync("_site/config.js", `window.MEMORIAL_API_BASE = ${JSON.stringify(process.env.MEMORIAL_API_BASE || "")};\n`)'

      - name: Mirror approved public stories and photographs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          npm install --prefix "$RUNNER_TEMP/memorial-mirror-tools" wrangler@4.92.0
          export WRANGLER_BIN="$RUNNER_TEMP/memorial-mirror-tools/node_modules/.bin/wrangler"
          python3 scripts/build-public-mirror.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
