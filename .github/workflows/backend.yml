name: Deploy memorial submission service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "drizzle/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "next.config.ts"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: memorial-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
      MEMORIAL_OWNER_EMAIL: ${{ vars.MEMORIAL_OWNER_EMAIL }}
      REVIEW_NOTIFICATION_TO: ${{ vars.REVIEW_NOTIFICATION_TO }}
      REVIEW_NOTIFICATION_FROM: ${{ vars.REVIEW_NOTIFICATION_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the service
        run: pnpm build

      - name: Prepare Cloudflare configuration
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Apply database migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/wrangler.deploy.json

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.deploy.json

      - name: Activate email service
        if: ${{ env.RESEND_API_KEY != '' }}
        run: printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY --config dist/server/wrangler.deploy.json
